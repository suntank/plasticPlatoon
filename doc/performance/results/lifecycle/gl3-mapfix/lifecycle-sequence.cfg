alias pp_wait10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias pp_wait60 "pp_wait10;pp_wait10;pp_wait10;pp_wait10;pp_wait10;pp_wait10"
alias pp_wait120 "pp_wait60;pp_wait60"
pp_wait120
echo LIFECYCLE_START_initial
status
cl_perf_start gl3-initial
pp_wait60
cl_perf_start gl3-initial
pp_wait60
cl_perf_stop
screenshot png
echo LIFECYCLE_DONE_initial
gamemap pp_lifecycle_reload
pp_wait120
echo LIFECYCLE_START_map-reload
status
cl_perf_start gl3-map-reload
pp_wait120
cl_perf_stop
screenshot png
echo LIFECYCLE_DONE_map-reload
vid_restart
pp_wait120
echo LIFECYCLE_START_restart
status
cl_perf_start gl3-restart
pp_wait120
cl_perf_stop
screenshot png
echo LIFECYCLE_DONE_restart
set gl3_static_world 0
echo LIFECYCLE_START_fallback
status
cl_perf_start gl3-fallback
pp_wait120
cl_perf_stop
screenshot png
echo LIFECYCLE_DONE_fallback
set gl3_static_world 1
vid_restart
pp_wait120
echo LIFECYCLE_START_restored
status
cl_perf_start gl3-restored
pp_wait120
cl_perf_stop
screenshot png
echo LIFECYCLE_DONE_restored
echo LIFECYCLE_COMPLETE
quit
