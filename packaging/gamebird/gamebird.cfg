// Game Bird / Pi Zero 2 W. Persistent user settings live in GAMEBIRD_SAVE_DIR.
exec performance/pi_zero2.cfg
set s_openal "0"
set crosshair "1"
set cl_run "1"
set cl_yawspeed "110"
set joy_escbutton "0"
set singleplayer "1"
set coop "0"
set deathmatch "0"
set maxclients "1"
set scr_gamebird_hud "1"
set cl_gamebird_autolevel "1"

// Twelve-button handheld controls. USB/Bluetooth analog sticks still work.
// The handheld's physical north/east buttons report SDL west/north.
bind DP_UP "+gb_up"
bind DP_DOWN "+gb_down"
bind DP_LEFT "+gb_left"
bind DP_RIGHT "+gb_right"
bind SHOULDR_LEFT "+moveleft"
bind SHOULDR_RIGHT "+moveright"
bind BTN_SOUTH "+attack"
bind BTN_EAST "+moveup"
bind BTN_WEST "+ads"
bind BTN_NORTH "+gb_modifier"
bind BTN_BACK "quickgrenade"
bind BTN_START "togglemenu"
