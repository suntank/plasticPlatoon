// Original Plastic Platoon defaults generated by build_bootstrap.py.
unbindall
bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind SPACE +moveup
bind CTRL +movedown
bind SHIFT +speed
bind MOUSE1 +attack
bind MOUSE2 +ads
bind TRIG_LEFT +ads
bind TRIG_RIGHT +attack
bind BTN_SOUTH +moveup
bind BTN_EAST +movedown
bind BTN_WEST +use
bind BTN_NORTH quickgrenade
bind SHOULDR_LEFT weapprev
bind SHOULDR_RIGHT quickgrenade
bind STICK_LEFT +speed
bind DP_UP invuse
bind DP_DOWN inven
bind DP_LEFT weapprev
bind DP_RIGHT weapnext
bind BTN_BACK score
bind MWHEELUP weapprev
bind MWHEELDOWN weapnext
bind TAB inven
bind ENTER invuse
bind [ invprev
bind ] invnext
bind ` toggleconsole
bind ~ toggleconsole
bind ESCAPE menu_main
bind F1 help
bind F2 menu_savegame
bind F3 menu_loadgame
bind F10 menu_quit
bind 1 "use Pistol"
bind 2 "use Shotgun"
bind 3 "use Double Barrel Shotgun"
bind 4 "use Rifle"
bind 5 "use Heavy Machinegun"
bind 6 "use Grenade Launcher"
bind 7 "use Rocket Launcher"
bind 8 "use M1 Flamethrower"
bind 9 "use Sniper Rifle"
bind 0 "use Mortar Cannon"
set skin soldier/green
set name Platoon
set hostname "Plastic Platoon"
set vid_fullscreen 0
set r_mode 4
set crosshair 1
set cl_run 1
set freelook 1
set lookstrafe 0
set sensitivity 3
set in_grab 2
alias d1 "menu_main"
alias newgame "map pp_sandstorm"
alias dedicated_start "map pp_sandstorm"
