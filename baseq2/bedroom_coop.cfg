// Operation Nightlight: four-player network co-op host.
// For local split-screen, start the usual split-screen co-op session first,
// then enter: map pp_bedroom
disconnect
// Every joining client should set r_farsee 1 and run vid_restart once.
set r_farsee 1
vid_restart
set deathmatch 0
set coop 1
set singleplayer 0
set maxclients 4
set skill 1
map pp_bedroom
