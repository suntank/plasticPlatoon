// Initial Pi Zero 2 W / Game Bird measurement preset, not a 30 FPS guarantee.
// Choose +set vid_renderer gl1 (or gles1) before initialization.
// Renderer-neutral so this preset cannot silently change a GLES1 launch.
set r_mode "-1"
set r_customwidth "240"
set r_customheight "240"
set r_vsync "1"
set vid_maxfps "30"
set cl_async "1"
set cl_maxfps "60"
set r_msaa_samples "0"
set r_anisotropic "0"
set r_shadows "0"
set r_clear "1"
set gl1_ztrick "0"
set gl1_static_world "1"
set r_viscache "1"
set gl1_multitexture "1"
set gl1_picmip "0"
set gl1_dynamic "1"
set cl_entities "1"
set cl_particles "1"
set cl_lights "1"
set gl_finish "0"
set r_perf "0"
set r_perf_gpu "0"
