// Temple: 2-4 player deathmatch. Keeps the current player/controller setup.
// Set up local split-screen in Multiplayer first, or host a network match.
set deathmatch 1
set coop 0
set singleplayer 0
// Keep all four joining players alive on the five original N64 spawn pads.
set dmflags 512
set timelimit 10
set fraglimit 20
map pp_temple
