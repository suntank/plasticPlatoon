// Switchyard: 2-4 player deathmatch. Keeps the current player/controller setup.
// Set up local split-screen in Multiplayer first, or host a network match.
set deathmatch 1
set coop 0
set singleplayer 0
// Keep joining players alive when a spawn is occupied.
set dmflags 512
set timelimit 10
set fraglimit 20
map pp_switchyard
