name: Testbuild for Win64
run-name: testbuild_win64
on:
  push:
    branches:
      - 'main'
  pull_request:
    types:
      - edited
      - opened
      - synchronize
      - ready_for_review
concurrency:
  # Cancel concurrent workflows for the same PR or commit hash.
  group: ${{github.workflow}}-${{github.event_name == 'pull_request' && github.head_ref || github.sha}}
  cancel-in-progress: true
jobs:
  build_mingw_x86_64:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sys: mingw64, env: x86_64 }
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{matrix.sys}}
        update: true
        install: >-
          git
          make
          zip
          unzip
          python
          wget
          mingw-w64-${{matrix.env}}-curl
          mingw-w64-${{matrix.env}}-gcc
          mingw-w64-${{matrix.env}}-openal
          mingw-w64-${{matrix.env}}-pkgconf
    - name: Check out repository code
      uses: actions/checkout@v6
    - name: Build
      shell: msys2 {0}
      run: |
        # Download and extract SDL3 devel files.
        wget -c https://github.com/libsdl-org/SDL/releases/download/release-3.2.24/SDL3-devel-3.2.24-mingw.tar.gz
        tar xf SDL3-devel-3.2.24-mingw.tar.gz
        mv SDL3-3.2.24 SDL3
        # Public runners come with 4 CPUs.
        PKG_CONFIG_PATH=SDL3/x86_64-w64-mingw32/lib/pkgconfig make WITH_SDL3=yes -j4
        PKG_CONFIG_PATH=SDL3/x86_64-w64-mingw32/lib/pkgconfig make WITH_SDL3=yes -j4 ref_gles1
    - name: Create testbuild package
      shell: msys2 {0}
      run: |
        # Create release directory tree
        mkdir -p publish/quake2-win64-${{github.sha}}/misc/docs
        # Copy release assets
        cp -r release/* publish/quake2-win64-${{github.sha}}/
        # Copy misc assets
        cp -r stuff/yq2.cfg publish/quake2-win64-${{github.sha}}/misc/yq2.cfg
        if [ -d stuff/mapfixes ]; then cp -r stuff/mapfixes publish/quake2-win64-${{github.sha}}/misc; fi
        cp LICENSE publish/quake2-win64-${{github.sha}}/misc/docs/LICENSE.txt
        cp README.md publish/quake2-win64-${{github.sha}}/misc/docs/README.txt
        if [ -d doc ]; then cp -r doc/. publish/quake2-win64-${{github.sha}}/misc/docs/; fi
        # SDL3
        cp SDL3/x86_64-w64-mingw32/bin/SDL3.dll publish/quake2-win64-${{github.sha}}/
        # openal-soft
        wget -c https://github.com/kcat/openal-soft/releases/download/1.24.3/openal-soft-1.24.3-bin.zip
        unzip -o openal-soft-1.24.3-bin.zip
        cp openal-soft-1.24.3-bin/bin/Win64/soft_oal.dll publish/quake2-win64-${{github.sha}}/openal32.dll
        # curl (releases use a custom build curl.dll)
        wget -c -O curl-mingw-latest.zip "https://curl.se/windows/latest.cgi?p=win64-mingw.zip"
        unzip -o curl-mingw-latest.zip
        cp curl-*-win64-mingw/bin/libcurl-x64.dll publish/quake2-win64-${{github.sha}}/curl.dll
    - name: Upload testbuild package
      uses: actions/upload-artifact@v7
      with:
        name: quake2-win64-${{github.sha}}
        path: publish/
        if-no-files-found: error
